# DigitalOcean App Platform spec. Deploy: doctl apps create --spec .do/app.yaml
# Then set ANTHROPIC_API_KEY as an encrypted env var in the DO dashboard.
name: throughline
region: sfo
services:
  - name: web
    github:
      repo: Cherlz/throughline
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
