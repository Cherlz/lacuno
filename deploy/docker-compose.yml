# Lacuno + Caddy (automatic HTTPS). Started by deploy/setup.sh.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
